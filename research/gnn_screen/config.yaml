model:
  hidden_dim: 128
  layers: 3
  dropout: 0.10
training:
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size_graphs: 64
  max_epochs: 100
  early_stopping_patience: 12
  gradient_clip_norm: 1.0
  training_seeds: [0, 1, 2, 3, 4]
  split_seed: 2026
  healthy_false_trigger_rate: 0.01
  balanced_sampling: true
calibration:
  healthy_false_trigger_rate: 0.01
evaluation:
  bootstrap_replicates: 1000
  bootstrap_seed: 2026
